[package]
name = "fasm-storage"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
description = "Ordered async byte-oriented key-value storage: the KvStore/Commit traits and the Storage Scoping adapter shared by FASM state machines and their storage backends"

[dependencies]
thiserror.workspace = true
# The HCA candidate source: pinned to the same major the foundationdb
# crate already pulls in transitively (it declares rand 0.10).
rand = "0.10"

[dev-dependencies]
# Note: this crate deliberately has no dependency on a backend crate (that
# would be a dev-dependency cycle, since backends depend on this one). The
# store-backed tests therefore live in the backend crates; this crate's own
# tests exercise only the pure logic (keyspace arithmetic, KvStream behavior)
# against a local test-double error type.
proptest.workspace = true

[features]
default = []
# Exposes the `kv_store_tests!` conformance macro and the `__private` re-export
# module it expands into.
#
# Enable from `[dev-dependencies]` in backend crates. The macro emits `#[test]`
# functions, so it has no business being compiled into a production build.
test-utils = []
