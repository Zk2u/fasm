name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: fmt + clippy (storage crates)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: >
          cargo clippy
          -p fasm-storage -p fasm-storage-btreemap -p fasm-storage-redb -p fasm-storage-fdb -p fasm-storage-indexeddb
          --all-targets -- -D warnings
      - name: clippy (FDB test suite)
        run: >
          cargo clippy
          -p fasm-storage-fdb --all-targets --features fdb-storage-tests
          -- -D warnings

  # Keep fasm-storage browser-compatible for the IndexedDB backend's `?Send`
  # formulation; `--tests` covers its compile contract and test-utils macros.
  wasm-check:
    name: check fasm-storage on wasm32
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - name: check
        run: cargo check -p fasm-storage --features test-utils --tests --target wasm32-unknown-unknown
      - name: clippy
        run: cargo clippy -p fasm-storage --features test-utils --tests --target wasm32-unknown-unknown -- -D warnings
      - name: clippy (IndexedDB all targets)
        run: cargo clippy -p fasm-storage-indexeddb --all-targets --target wasm32-unknown-unknown -- -D warnings

  wasm-test:
    name: IndexedDB backend tests (headless Chrome + Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      # ubuntu-latest ships Chrome and Firefox, and wasm-pack downloads the
      # matching WebDriver. If this job breaks, check for a driver/browser
      # version mismatch first.
      - name: Test IndexedDB backend in Chrome
        run: wasm-pack test --headless --chrome crates/fasm-storage-indexeddb
      - name: Test IndexedDB backend in Firefox
        run: wasm-pack test --headless --firefox crates/fasm-storage-indexeddb

  test:
    name: tests (FDB 7.3 live cluster)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Setup FoundationDB
        uses: foundationdb-rs/foundationdb-actions-install@v2.3.0
        with:
          version: "7.3.79"
      - name: Configure cluster
        run: fdbcli --exec "configure single memory tenant_mode=optional_experimental"
      - name: Workspace tests
        run: cargo test --workspace
      - name: FDB backend tests
        # Single-threaded: the binary shares one live cluster, and the
        # root-level nav suite asserts exact root listings against a
        # baseline captured at each test's start — a parallel test's
        # commit could otherwise land inside that window.
        run: cargo test -p fasm-storage-fdb --features fdb-storage-tests -- --test-threads=1
      - name: FDB diagnostics (on failure)
        # Captures the cluster's state when the test step fails:
        # server-side failures (broken_promise, 1100, OOM kills) are
        # otherwise invisible from the test binary.
        if: failure()
        run: |
          echo "=== fdbserver process ==="
          pgrep -a fdbserver || echo "NO fdbserver process"
          echo "=== fdbcli status ==="
          fdbcli --exec "status details local" || true
          echo "=== server log ==="
          server_log=$(find /var/log /opt /tmp -name "fdbserver.log" 2>/dev/null | head -1)
          if [ -n "$server_log" ]; then tail -120 "$server_log"; else echo "no fdbserver.log found"; fi
          echo "=== monitor log ==="
          monitor_log=$(find /var/log /opt /tmp -name "fdbmonitor.log" 2>/dev/null | head -1)
          if [ -n "$monitor_log" ]; then tail -60 "$monitor_log"; else echo "no fdbmonitor.log found"; fi
          echo "=== OOM evidence ==="
          (dmesg 2>/dev/null || sudo -n dmesg 2>/dev/null) | grep -iE "oom|killed process" | tail -20 || echo "dmesg unavailable"
          (journalctl -k 2>/dev/null || sudo -n journalctl -k 2>/dev/null) | grep -iE "oom|killed process" | tail -20 || echo "journalctl unavailable"
          echo "=== memory ==="
          free -h
          for f in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory/memory.limit_in_bytes /sys/fs/cgroup/memory/memory.usage_in_bytes; do
            if [ -r "$f" ]; then echo "--- $f"; cat "$f"; fi
          done
