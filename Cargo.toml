[package]
name = "fasm"
version = "0.3.1"
edition = "2024"
authors = ["Azz <zk2u@pm.me>"]
description = "Fallible Async State Machines"
repository = "https://github.com/zk2u/fasm"
license = "MIT OR Apache-2.0"

[dependencies]

[dev-dependencies]
monoio = "0.2.4"

[workspace]
resolver = "3"
members = [
    "dentist_booking",
    "crates/fasm-storage",
    "crates/fasm-storage-btreemap",
    "crates/fasm-storage-redb",
    "crates/fasm-storage-fdb",
    "crates/fasm-storage-indexeddb",
]

[workspace.package]
edition = "2024"
repository = "https://github.com/zk2u/fasm"
license = "MIT OR Apache-2.0"
publish = true

[workspace.dependencies]
# The version key is required to publish dependents: cargo strips the
# path and keeps the version in the uploaded manifest.
fasm-storage = { path = "crates/fasm-storage", version = "0.1.0" }
fasm-storage-btreemap = { path = "crates/fasm-storage-btreemap" }
fasm-storage-redb = { path = "crates/fasm-storage-redb" }
fasm-storage-fdb = { path = "crates/fasm-storage-fdb" }
fasm-storage-indexeddb = { path = "crates/fasm-storage-indexeddb" }

thiserror = "2"
proptest = "1.11"
redb = "2"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
foundationdb = "0.11"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
